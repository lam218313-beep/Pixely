# Builds an installable test APK of the client app (frontend/app) on every change.
# Download it from the run's "Artifacts" (pixely-app-debug) and open it on an Android phone.
# It is a debug build for testing: the Play Store version is signed separately (see frontend/app/README.md).
name: App Android (APK de prueba)

on:
  push:
    paths:
      - 'frontend/app/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: frontend/app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pixely-app-debug
          path: frontend/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Opens the APK in an Android emulator and keeps a screenshot and the log, to see what a phone sees.
  emulador:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pixely-app-debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app-debug.apk
            adb logcat -c
            adb shell am start -n pe.pixely.app/.MainActivity
            sleep 30
            adb exec-out screencap -p > emulador-30s.png
            adb logcat -d > logcat.txt
            adb shell dumpsys window | grep -i mCurrentFocus || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador
          path: |
            emulador-30s.png
            logcat.txt
          retention-days: 7

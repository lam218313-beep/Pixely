<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pixely</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- If the app's code can't even start (old phone, failed download), say so instead of a black screen. -->
    <script>
      window.__pixelyErrors = [];
      window.addEventListener('error', function (e) { window.__pixelyErrors.push(String(e.message || e)); });
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.firstChild) {
          r.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;background:#0A0A0C;color:#fff;font-family:system-ui,sans-serif">'
            + '<p style="margin:0;font-size:24px;font-weight:800">No pudimos abrir Pixely<span style="color:#EB0C6E">.</span></p>'
            + '<p style="margin:0;font-size:15px;color:#B4B4BE">Revisa tu conexión y vuelve a abrir la app. Si sigue pasando, avísanos.</p>'
            + '<p style="margin:0;font-size:12px;color:#8A8A96;word-break:break-word">' + window.__pixelyErrors.join(' · ').replace(/</g, '&lt;') + '</p></div>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

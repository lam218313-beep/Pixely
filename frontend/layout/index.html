<!DOCTYPE html>
<html lang="es" class="noche">

<head>
  <meta charset="UTF-8" />
  <script>
    // Phones get the mobile version (frontend/app, served at /m/). "?escritorio=1" keeps a
    // phone on this desktop version (remembered); "?movil=1" sends it back to the mobile one.
    (function () {
      try {
        var q = location.search, key = 'pixely_version';
        if (q.indexOf('escritorio=1') > -1) localStorage.setItem(key, 'escritorio');
        if (q.indexOf('movil=1') > -1) localStorage.removeItem(key);
        var phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
        if (phone && localStorage.getItem(key) !== 'escritorio') location.replace('/m/');
      } catch (e) { /* stay on desktop */ }
    })();
  </script>
  <link rel="icon" type="image/png" href="/favicon-64.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixely Partners</title>
  <style>
    body {
      background-color: #0A0A0C;
    }

    /* Hide scrollbar but keep scroll functionality */
    ::-webkit-scrollbar {
      width: 0px;
      height: 0px;
      display: none;
    }

    * {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Custom Animations */
    @keyframes draw-check {
      0% {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }

      100% {
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
      }
    }

    @keyframes scale-up-center {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fade-out {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes rotate-in {
      0% {
        transform: rotate(-360deg) scale(0);
        opacity: 0;
      }

      60% {
        transform: rotate(20deg) scale(1.1);
        opacity: 1;
      }

      100% {
        transform: rotate(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes fade-in-up {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes orbit {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes wave-bar {

      0%,
      100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(0.6);
      }
    }

    @keyframes needle-sweep {

      0%,
      100% {
        transform: rotate(-60deg);
      }

      50% {
        transform: rotate(60deg);
      }
    }

    @keyframes draw-path {
      0% {
        stroke-dashoffset: 1000;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
